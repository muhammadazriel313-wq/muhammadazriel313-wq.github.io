<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Purple Rim Light Gradient -->
    <linearGradient id="purpleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyan Rim Light Gradient -->
    <linearGradient id="cyanRim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <!-- Silhouette Shading -->
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="30%" y1="20%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#242d3d"/>
      <stop offset="50%" stop-color="#18202d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Subtle grid / tech accent -->
  <circle cx="250" cy="240" r="170" fill="none" stroke="rgba(147, 51, 234, 0.15)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="250" cy="240" r="210" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>

  <!-- Left Purple Rim Lighting Atmosphere -->
  <ellipse cx="140" cy="220" rx="90" ry="140" fill="url(#purpleRim)" filter="url(#softGlow)" opacity="0.35"/>
  <!-- Right Cyan Rim Lighting Atmosphere -->
  <ellipse cx="360" cy="230" rx="80" ry="130" fill="url(#cyanRim)" filter="url(#softGlow)" opacity="0.3"/>

  <!-- Silhouette Group -->
  <g id="figure">
    <!-- Shoulders / Torso / Shirt -->
    <path d="M 120 560 C 130 460, 155 405, 195 385 L 225 380 L 225 355 L 275 355 L 275 380 L 305 385 C 345 405, 370 460, 380 560 Z" fill="url(#bodyGrad)"/>
    
    <!-- Shirt Collar details -->
    <path d="M 225 380 L 250 430 L 210 395 Z" fill="#1e2638" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <path d="M 275 380 L 250 430 L 290 395 Z" fill="#20293c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="250" y1="430" x2="250" y2="560" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="228" y="325" width="44" height="45" rx="10" fill="url(#headGrad)"/>
    
    <!-- Head Base -->
    <ellipse cx="250" cy="245" rx="64" ry="78" fill="url(#headGrad)"/>
    
    <!-- Modern Textured Hair Silhouette -->
    <path d="M 180 230 C 175 190, 195 145, 235 140 C 270 135, 310 155, 318 190 C 325 210, 322 235, 320 245 C 315 220, 310 195, 290 180 C 270 168, 240 170, 225 185 C 205 200, 190 220, 180 230 Z" fill="#0d1117"/>
    <path d="M 195 160 C 220 142, 260 142, 285 155 C 305 165, 315 185, 318 205 C 300 180, 265 170, 230 180 C 210 186, 200 200, 195 215 Z" fill="#141a24"/>

    <!-- Rim Lighting strokes on Silhouette -->
    <!-- Left purple rim edge -->
    <path d="M 186 240 C 182 205, 202 165, 235 145" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)"/>
    <path d="M 135 520 C 145 445, 170 405, 205 388" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Right cyan rim edge -->
    <path d="M 314 195 C 320 215, 318 245, 312 265" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)"/>
    <path d="M 365 520 C 355 445, 330 405, 295 388" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Subtle Ear indications -->
    <ellipse cx="186" cy="250" rx="7" ry="14" fill="#1a2230"/>
    <ellipse cx="314" cy="250" rx="7" ry="14" fill="#181f2c"/>
  </g>

  <!-- Specular highlights & subtle futuristic sparkles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="160" cy="180" r="1.5" />
    <circle cx="350" cy="190" r="1.5" />
    <circle cx="370" cy="330" r="1.2" />
    <circle cx="130" cy="320" r="1.2" />
  </g>
</svg>
